[package]
name = "codex-usage-taskbar"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Windows taskbar widget for Codex usage limits"
homepage = "https://github.com/forest/codex-usage-taskbar"
repository = "https://github.com/forest/codex-usage-taskbar"

[package.metadata.winres]
CompanyName = "Forest"
ProductName = "Codex Usage Taskbar"
FileDescription = "Codex Usage Taskbar"
OriginalFilename = "codex-usage-taskbar.exe"
InternalName = "CodexUsageTaskbar"
Comments = "https://github.com/forest/codex-usage-taskbar"
LegalCopyright = "Copyright (C) 2026 Forest. Based on Claude Code Usage Monitor by Code Zeno Pty Ltd."

[dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls", "json", "proxy-from-env"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
]

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
